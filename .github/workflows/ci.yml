# Continuous integration: lint and test every push and pull request to main,
# then check that the Docker image builds and actually starts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  # Lint + tests on every supported Python version.
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every Python version's result, even if one fails.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # Install Python and cache pip downloads, keyed on pyproject.toml so the
      # cache is refreshed whenever dependencies change.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  # Build the image, then start both services from it as a smoke test.
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t vehicle-mcp-gateway:ci .

      - name: Image runs as a non-root user
        run: test "$(docker run --rm vehicle-mcp-gateway:ci whoami)" = app

      # Throwaway secrets that exist only for this CI run.
      - name: Start backend and gateway
        run: |
          docker network create vmg
          docker run -d --name backend --network vmg \
            -e SERVICE=backend -e PORT=8001 -e BACKEND_SERVICE_KEY=ci-service-key \
            vehicle-mcp-gateway:ci
          docker run -d --name gateway --network vmg -p 8000:8000 \
            -e SERVICE=gateway -e PORT=8000 -e BACKEND_URL=http://backend:8001 \
            -e BACKEND_SERVICE_KEY=ci-service-key -e MCP_CLIENT_TOKEN=ci-client-token \
            vehicle-mcp-gateway:ci

      - name: Gateway is healthy and enforces the bearer token
        run: |
          # Wait up to 30 s for the gateway to come up.
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 1; done
          curl -fsS http://localhost:8000/health
          # No token: must be 401.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/mcp)
          test "$code" = 401
          # Correct token: the request gets past auth (any status except 401).
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/mcp \
            -H 'Authorization: Bearer ci-client-token' \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}')
          echo "status with token: $code"
          test "$code" != 401

      - name: Backend health check passes inside the network
        run: test "$(docker inspect --format '{{.State.Health.Status}}' backend)" != unhealthy

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs backend || true
          docker logs gateway || true
